name: Build and Release Target Guard APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Update GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TargetGuard.apk

      - name: Update GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Target Guard v1.0.0
          body: "Official Android APK release for Target Guard with Anti-Uninstall shield, 1-minute rolling PIN, and Realtime parental remote control."
          files: TargetGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
